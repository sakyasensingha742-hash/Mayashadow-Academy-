name: Apply site enhancements
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add enhancement assets to HTML pages
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              if 'site-enhancements.css' not in s:
                  s=s.replace('</head>', '<link rel="stylesheet" href="site-enhancements.css">\n</head>', 1)
              if 'site-enhancements.js' not in s:
                  s=s.replace('</body>', '<script src="site-enhancements.js"></script>\n</body>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' site-enhancements.css site-enhancements.js
          git rm .github/workflows/apply-site-enhancements.yml
          git commit -m "Add professional UI popups and site enhancements" || exit 0
          git push
