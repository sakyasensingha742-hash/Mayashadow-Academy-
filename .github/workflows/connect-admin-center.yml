name: Connect admin control center
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add control center navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin.html'); s=p.read_text(encoding='utf-8')
          marker='<div class="admin-badge">'
          if 'admin-control-center.html' not in s and marker in s:
              s=s.replace(marker,'<a href="admin-control-center.html" style="margin-right:16px;color:#35bdf5;text-decoration:none;font-size:13px;font-weight:800">⚙ Control Center</a>\n\n        '+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git rm .github/workflows/connect-admin-center.yml
          git commit -m "Connect admin panel to control center" || exit 0
          git push
